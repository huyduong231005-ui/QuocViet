name: Core checks
on: [push, pull_request]
jobs:
  test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable service container; the native tests create and drop their own databases.
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # With TEST_DATABASE_URL set, the PostgreSQL-only tests run instead of skipping.
      - run: npm test
      - run: npm run build
